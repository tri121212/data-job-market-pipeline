name: data-job-market

services:
  postgres:
    image: postgres:16
    container_name: djm-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-djm}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-djm_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-jobmarket}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-djm} -d ${POSTGRES_DB:-jobmarket}"]
      interval: 5s
      timeout: 3s
      retries: 12

  minio:
    image: pgsty/minio:RELEASE.2026-08-04T00-00-00Z
    container_name: djm-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 12

volumes:
  pgdata:
  miniodata:
